<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨知 · 书库</title>
<link rel="icon" href="/favicon.svg">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/nav.js"></script>
<style>
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 24px 64px; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font: 600 26px var(--serif); margin: 0; letter-spacing: .05em; }
  .lib-path { font-size: 12px; }
  .continue { display: flex; gap: 20px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin: 20px 0 28px; cursor: pointer; }
  .continue:hover { box-shadow: var(--shadow); }
  .continue .cover { width: 72px; flex: none; padding: .6em 0; }
  .continue h2 { font: 600 18px var(--serif); margin: 0 0 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 28px 22px; }
  .book { cursor: pointer; }
  .cover { aspect-ratio: 3 / 4; border-radius: 4px 8px 8px 4px; position: relative; overflow: hidden; box-shadow: 2px 3px 10px rgba(0,0,0,.15), inset 6px 0 8px -6px rgba(0,0,0,.35); display: flex; justify-content: center; padding: 1.2em 0; transition: transform .15s; }
  .book:hover .cover { transform: translateY(-3px); }
  .cover .t { writing-mode: vertical-rl; font: 600 17px/1.3 var(--serif); letter-spacing: .12em; color: rgba(255,255,255,.92); max-height: 100%; overflow: hidden; }
  .cover .fmt { position: absolute; right: 8px; bottom: 6px; font-size: 10px; letter-spacing: .1em; color: rgba(255,255,255,.7); text-transform: uppercase; }
  .continue .cover .t { font-size: 12px; }
  .meta { margin-top: 8px; }
  .meta .name { font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .bar.done i { background: var(--ok); }
  .status { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
  .ocr-btn { margin-top: 6px; font-size: 12px; border: 1px solid var(--accent); color: var(--accent); background: none; border-radius: 12px; padding: 1px 10px; }
  .ocr-btn:hover { background: var(--accent-soft); }
  .book { position: relative; }
  .book .more { position: absolute; top: 6px; right: 6px; z-index: 2; width: 26px; height: 26px; border: 0; border-radius: 50%; background: rgba(0,0,0,.35); color: #fff; font-size: 15px; line-height: 1; opacity: 0; transition: opacity .15s; }
  .book:hover .more, .book .more:focus-visible, .book .more.open { opacity: 1; }
  @media (hover: none) { .book .more { opacity: .8; } }
  .tags { font-size: 12px; color: var(--ink-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filters { display: flex; flex-direction: column; gap: 8px; margin: 0 0 22px; }
  .filters .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .filters .chip .n { opacity: .6; margin-left: 4px; }
  .filters .label { font-size: 12px; color: var(--ink-3); margin-right: 2px; }
  .menu { position: fixed; z-index: 50; width: 260px; max-height: 80vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; font-size: 13px; }
  .menu h4 { margin: 12px 0 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .menu h4:first-child { margin-top: 0; }
  .menu .tagset { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .menu .tagset .chip.sug { border-style: dashed; }
  .menu input[type=text] { padding: 4px 8px; }
  .menu .act { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 6px; border-radius: 6px; }
  .menu .act:hover { background: var(--line); }
  .menu .act::before { content: '○ '; color: var(--ink-3); }
  .menu .act.on::before { content: '✓ '; color: var(--ok); }
  .menu .hint { font-size: 12px; color: var(--ink-3); }
  .empty { text-align: center; padding: 80px 20px; color: var(--ink-2); }
  .empty code { background: var(--surface); border: 1px solid var(--line); padding: 2px 8px; border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>墨知 · 书库</h1>
    <span class="lib-path muted" id="libPath"></span>
    <span style="flex:1"></span>
    <nav class="topnav" id="topnav"></nav>
    <button class="btn" id="rescan">重新扫描</button>
  </header>
  <div id="continue"></div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="menu" id="menu" hidden></div>
<script type="module">
const $ = s => document.querySelector(s)
const palette = ['#6b4f3a', '#3d5a6c', '#5b4a7a', '#4a6b52', '#7a4a4a', '#5a5a3d', '#3d4f6b', '#6b3d5a']
const hue = s => palette[[...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % palette.length]
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

const cover = b => `<div class="cover" style="background:linear-gradient(160deg, ${hue(b.title)}, #222 160%)"><span class="t">${esc(b.title.replace(/\.(pdf|epub)$/i, '').slice(0, 24))}</span><span class="fmt">${b.format}</span></div>`
const pct = b => Math.round((b.progress?.fraction ?? 0) * 100)
// 读完之后重翻：进度条保持满格，文字写「已读完 · 重读到 x%」
const rereading = b => b.finished && b.progress && Date.parse(b.progress.updatedAt) > Date.parse(b.finished.at) + 60000 && pct(b) < 100
const readText = b => b.shelved ? `搁置${b.progress ? ` · 读到 ${pct(b)}%` : ''}` : b.finished ? (rereading(b) ? `✓ 已读完 · 重读到 ${pct(b)}%` : '✓ 已读完') : b.progress ? `读到 ${pct(b)}%` : '未开始'
const bar = (b, style = '') => `<div class="bar${b.finished ? ' done' : ''}"${style}><i style="width:${b.finished ? 100 : pct(b)}%"></i></div>`
const statusText = b => {
  const s = b.status
  if (s.stage === 'queued') return '等待解析'
  if (s.stage === 'extracting') return '解析中…'
  if (s.stage === 'embedding') return `建立语义索引 ${s.done}/${s.total}`
  if (s.stage === 'error') return '解析失败：' + s.error
  const read = readText(b)
  const o = b.ocr
  if (!o) return read
  if (o.stage === 'queued') return '排队等待识别文字'
  if (o.stage === 'running') return `本机识别文字 ${o.done}/${o.total} 页`
  if (o.stage === 'paused') return `已识别 ${o.done}/${b.sectionCount} 页 · 已暂停`
  if (o.stage === 'error') return `识别失败：${o.error ?? ''}`
  if (o.stage === 'done') return `${read} · 文字由本机识别`
  return b.progress ? `${read} · 扫描版，无文字层` : '扫描版 · 无文字层'
}
// 扫描版的识别按钮：文字识别全程在本机运行，不上传
const ocrButton = b => {
  const st = b.ocr?.stage
  if (!st || st === 'done' || b.status.stage !== 'ready' && b.status.stage !== 'embedding') return ''
  const [act, label] = { none: ['start', '识别文字'], paused: ['start', '继续识别'], error: ['start', '重试识别'], queued: ['stop', '取消'], running: ['stop', '暂停'] }[st]
  return `<button class="ocr-btn" data-ocr="${act}" data-book="${b.id}" title="用本机的文字识别（RapidOCR）把扫描页转成文字，之后能查找、划线，Claude 也能直接读。不联网、不上传。">${label}</button>`
}

// ---------- 筛选：阅读状态 + 分类 / 标签（记在本机，下次打开还在） ----------
const STATUS = [['all', '全部'], ['reading', '在读'], ['unread', '未读'], ['finished', '读完'], ['shelved', '搁置']]
const STATUS_LABEL = { unread: '未读', reading: '在读', finished: '读完', shelved: '搁置' }
let filter = { status: 'all', tag: null }
try { filter = { ...filter, ...JSON.parse(localStorage.getItem('moread.libFilter') || '{}') } } catch {}
const saveFilter = () => { try { localStorage.setItem('moread.libFilter', JSON.stringify(filter)) } catch {} }
const tagKey = t => (t.cat ? 'cat:' : 'tag:') + t.name
const match = b => (filter.status === 'all' || b.readStatus === filter.status)
  && (!filter.tag || (filter.tag.startsWith('cat:') ? b.category === filter.tag.slice(4) : b.tags.includes(filter.tag.slice(4))))
const tagLine = b => (b.category || b.tags.length) ? `<div class="tags">${[b.category && '📁 ' + esc(b.category), ...b.tags.map(t => '#' + esc(t))].filter(Boolean).join(' ')}</div>` : ''
function renderFilters(books) {
  const count = st => st === 'all' ? books.length : books.filter(b => b.readStatus === st).length
  const cats = [...new Set(books.map(b => b.category).filter(Boolean))].map(name => ({ name, cat: true, n: books.filter(b => b.category === name).length }))
  const tags = [...new Set(books.flatMap(b => b.tags))].map(name => ({ name, n: books.filter(b => b.tags.includes(name)).length })).sort((a, b) => b.n - a.n)
  const all = [...cats, ...tags]
  if (filter.tag && !all.some(t => tagKey(t) === filter.tag)) filter.tag = null
  $('#filters').innerHTML = !books.length ? '' : `<div class="row">${STATUS.map(([k, label]) => `<button class="chip${filter.status === k ? ' on' : ''}" data-status="${k}">${label}<span class="n">${count(k)}</span></button>`).join('')}</div>`
    + (all.length ? `<div class="row"><span class="label">分类 / 标签</span>${all.map(t => `<button class="chip${filter.tag === tagKey(t) ? ' on' : ''}" data-tag="${esc(tagKey(t))}" title="${t.cat ? '书库里的文件夹' : '标签'}">${t.cat ? '📁 ' : '#'}${esc(t.name)}<span class="n">${t.n}</span></button>`).join('')}</div>` : '')
}

// ---------- 每本书的「⋯」菜单：标签、搁置、读完、加入书单 ----------
let menuFor = null
async function openMenu(id, anchor) {
  menuFor = id
  const [{ books }, lists] = await Promise.all([fetch('/api/books').then(r => r.json()), fetch('/api/lists').then(r => r.json())])
  const b = books.find(x => x.id === id)
  if (!b || menuFor !== id) return
  const known = [...new Set(books.flatMap(x => x.tags))].filter(t => !b.tags.includes(t))
  const m = $('#menu')
  m.dataset.tags = JSON.stringify(b.tags)
  m.innerHTML = `<h4>标签${b.category ? ` <span class="hint">· 分类 📁 ${esc(b.category)}（文件夹）</span>` : ''}</h4>
    <div class="tagset">${b.tags.map(t => `<button class="chip on" data-untag="${esc(t)}" title="去掉这个标签">#${esc(t)} ×</button>`).join('') || '<span class="hint">还没有标签</span>'}</div>
    ${known.length ? `<div class="tagset">${known.slice(0, 12).map(t => `<button class="chip sug" data-addtag="${esc(t)}" title="加上">+ ${esc(t)}</button>`).join('')}</div>` : ''}
    <input type="text" id="newTag" placeholder="新标签，回车添加">
    <h4>阅读状态 · 现在是「${STATUS_LABEL[b.readStatus]}」</h4>
    <button class="act${b.shelved ? ' on' : ''}" data-shelve="${b.shelved ? 0 : 1}" title="暂时不读了，筛选时单独归一类。再翻页会自动回到「在读」">搁置</button>
    <button class="act${b.finished ? ' on' : ''}" data-finish="${b.finished ? 0 : 1}">已读完</button>
    <h4>加入书单</h4>
    ${lists.map(l => { const has = l.items.some(i => i.bookId === id); return `<button class="act${has ? ' on' : ''}" data-list="${l.id}" data-has="${has ? 1 : 0}">${esc(l.name)} <span class="hint">${l.items.length} 本</span></button>` }).join('')}
    <input type="text" id="newList" placeholder="新书单名，回车创建并加入">`
  m.hidden = false
  const r = anchor.getBoundingClientRect()
  m.style.left = Math.max(8, Math.min(r.right - 260, innerWidth - 268)) + 'px'
  m.style.top = Math.max(8, Math.min(r.bottom + 4, innerHeight - m.offsetHeight - 8)) + 'px'
  document.querySelectorAll('.more.open').forEach(x => x.classList.remove('open'))
  anchor.classList.add('open')
}
const closeMenu = () => { $('#menu').hidden = true; menuFor = null; document.querySelectorAll('.more.open').forEach(x => x.classList.remove('open')) }
const post = (url, body, method = 'POST') => fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
const menuTags = () => JSON.parse($('#menu').dataset.tags || '[]')
const setTags = tags => post(`/api/books/${menuFor}/tags`, { tags }, 'PUT')
async function refreshMenu(focusId) {
  const id = menuFor
  await render()
  const anchor = document.querySelector(`[data-menu="${id}"]`)
  if (!anchor) return closeMenu()
  await openMenu(id, anchor)
  if (focusId) document.getElementById(focusId)?.focus()
}
$('#menu').addEventListener('click', async e => {
  e.stopPropagation()
  const t = e.target.closest('button')
  if (!t) return
  if (t.dataset.untag != null) await setTags(menuTags().filter(x => x !== t.dataset.untag))
  else if (t.dataset.addtag != null) await setTags([...menuTags(), t.dataset.addtag])
  else if (t.dataset.shelve != null) await post(`/api/books/${menuFor}/shelved`, { on: t.dataset.shelve === '1' })
  else if (t.dataset.finish != null) await post(`/api/books/${menuFor}/finished`, { on: t.dataset.finish === '1' })
  else if (t.dataset.list) {
    if (t.dataset.has === '1') {
      const l = (await (await fetch('/api/lists')).json()).find(x => x.id === t.dataset.list)
      const it = l?.items.find(i => i.bookId === menuFor)
      if (it) await fetch(`/api/lists/${l.id}/items/${it.id}`, { method: 'DELETE' })
    } else await post(`/api/lists/${t.dataset.list}/items`, { bookId: menuFor })
  } else return
  refreshMenu()
})
$('#menu').addEventListener('keydown', async e => {
  if (e.key !== 'Enter' || e.isComposing || !e.target.value?.trim()) return
  const v = e.target.value.trim(), id = e.target.id
  if (id === 'newTag') await setTags([...menuTags(), ...v.split(/[,，、]/)])
  if (id === 'newList') {
    const l = await (await post('/api/lists', { name: v })).json()
    await post(`/api/lists/${l.id}/items`, { bookId: menuFor })
  }
  refreshMenu(id)
})
addEventListener('keydown', e => e.key === 'Escape' && menuFor && closeMenu())
addEventListener('scroll', () => menuFor && closeMenu(), { passive: true })

async function render() {
  const { books, libraryDir } = await (await fetch('/api/books')).json()
  $('#libPath').textContent = libraryDir
  const recent = books.find(b => b.progress)
  $('#continue').innerHTML = recent ? `<div class="continue" data-id="${recent.id}">${cover(recent)}<div style="flex:1"><div class="muted" style="font-size:12px">继续阅读</div><h2>${esc(recent.title)}</h2><div class="muted">${esc([recent.progress.tocLabel, recent.progress.label].filter(Boolean).join(' · '))}</div>${bar(recent, ' style="max-width:320px"')}<div class="status">${esc(readText(recent))}</div></div></div>` : ''
  const shown = books.filter(match)
  renderFilters(books)
  $('#grid').innerHTML = shown.length ? shown.map(b => `<div class="book" data-id="${b.id}"><button class="more" data-menu="${b.id}" title="标签、搁置、加入书单" aria-label="整理这本书">⋯</button>${cover(b)}<div class="meta"><div class="name">${esc(b.title)}</div>${b.author ? `<div class="muted" style="font-size:12px">${esc(b.author)}</div>` : ''}${tagLine(b)}${bar(b)}<div class="status">${esc(statusText(b))}</div>${ocrButton(b)}</div></div>`).join('')
    : books.length ? `<div class="empty" style="grid-column:1/-1">没有符合筛选的书。 <button class="btn" id="clearFilter">清除筛选</button></div>`
    : `<div class="empty" style="grid-column:1/-1">书库是空的。把 PDF / EPUB 放进 <code>${esc(libraryDir)}</code>，然后点「重新扫描」。</div>`
}
document.addEventListener('click', async e => {
  const more = e.target.closest('[data-menu]')
  if (more) { e.stopPropagation(); return menuFor === more.dataset.menu ? closeMenu() : openMenu(more.dataset.menu, more) }
  if (menuFor) return closeMenu()
  const st = e.target.closest('[data-status]')
  if (st) { filter.status = st.dataset.status; saveFilter(); return render() }
  const tg = e.target.closest('[data-tag]')
  if (tg) { filter.tag = filter.tag === tg.dataset.tag ? null : tg.dataset.tag; saveFilter(); return render() }
  if (e.target.id === 'clearFilter') { filter = { status: 'all', tag: null }; saveFilter(); return render() }
  const ocr = e.target.closest('[data-ocr]')
  if (ocr) {
    e.stopPropagation()
    ocr.disabled = true
    await fetch(`/api/books/${ocr.dataset.book}/ocr`, { method: ocr.dataset.ocr === 'start' ? 'POST' : 'DELETE' })
    return render()
  }
  const el = e.target.closest('[data-id]')
  if (el) location.href = `/reader.html?id=${el.dataset.id}`
})
$('#rescan').onclick = async () => { await fetch('/api/rescan', { method: 'POST' }); render() }
let t
new EventSource('/api/events').onmessage = e => {
  if (['book', 'shelf'].includes(JSON.parse(e.data).type) && !menuFor) { clearTimeout(t); t = setTimeout(render, 300) }
}
render()
</script>
</body>
</html>
